name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["manifest.json"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.Stinger --configuration Release

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.Stinger.Tests --configuration Release
