name: "Stinger"
guid: "a8d7f2c4-1b3e-4c5a-9e6f-2d8b7a4c9e01"
version: "1.0.3.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "kschumm"
overview: "Labels movies with mid- and post-credits scenes (stingers)"
description: |
  Detects stingers by analyzing the credits region of each movie with ffmpeg,
  cross-checked against TMDB keywords and Wikipedia's post-credits list.
  Writes credits media segments so skip-credits lands on the stinger, appends
  an overview marker, and can notify clients to stay tuned during playback.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.Stinger.dll"
changelog: |
  - Initial release
  - 1.0.1: Version bump, no functional changes
  - 1.0.2: Target Jellyfin 10.11 / net9.0 (IMediaSegmentManager moved namespace, MediaSegmentType moved to Jellyfin.Database.Implementations.Enums, TaskTriggerInfo.Type is now an enum)
  - 1.0.3: Scan a movie shortly after it's added to a library, instead of waiting for the daily scan (toggle in settings)
